name: mcp-tester

services:
  opensearch:
    build:
      context: .
      dockerfile: Dockerfile.opensearch
    container_name: mcp-test-opensearch
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - '${OPENSEARCH_PORT}:9200'
    volumes:
      - opensearch-test-data:/usr/share/opensearch/data
    networks:
      - internal

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    container_name: mcp-test-runner
    environment:
      - OLLAMA_HOST=http://host.docker.internal:${OLLAMA_HOST_PORT}
      - OPENSEARCH_HOST=http://opensearch:9200
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      # tests
      - ./:/mcp-tester
      # application
      - ../../Cargo.toml:/app/Cargo.toml:ro
      - ../../Cargo.lock:/app/Cargo.lock:ro
      - ../../src:/app/src:ro
      - ../../tests:/app/tests:ro
      - cargo-target-cache:/app/target
        # vibe-analyzer config
      - ./configs/config.json5:/root/.vibe-analyzer/config.json5:ro
      - ./configs/askalono-cache.bin.zstd:/root/.vibe-analyzer/askalono-cache.bin.zstd:ro
    networks:
      - internal
    depends_on:
      - opensearch

networks:
  internal:
    driver: bridge

volumes:
  cargo-target-cache:
    driver: local
  opensearch-test-data:
    driver: local
  cargo-cache:
    driver: local
  rustup-cache:
    driver: local
