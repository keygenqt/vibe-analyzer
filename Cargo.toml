[package]
name = "vibe-analyzer"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
readme = "README.cargo.md"
description = "Fast code indexer with AST analysis for OpenSearch MCP"

[profile.release]
opt-level = "z"
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap-cargo = "0.18"
colored = "3.1"
tokio = { version = "1", features = ["full"] }
walkdir = "2.5"
ignore = "0.4"
mime = "0.3"
mime_guess = "2.0"
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
thiserror = "2"
dunce = "1"
dirs = "6"
once_cell = "1.19"
uuid = { version = "1.18.1", features = ["v4"] }
askalono = "0.5.0"
reqwest = { version = "0.13", features = ["stream"] }
zip = "8.5"
tempfile = "3.27"

# Tree-sitter grammars
tree-sitter = "0.25.1"

tree-sitter-haskell = "0.23.1"
tree-sitter-dart = "0.1.0"
tree-sitter-postgres = "1.1.1"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-swift = "0.7.1"
tree-sitter-php = "0.24.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-bash = "0.25.1"
tree-sitter-batch = "0.5.0"
tree-sitter-xml = "0.7.0"
tree-sitter-kotlin = { git = "https://github.com/danieltrt/tree-sitter-kotlin", rev = "ff4faf1d4e76a579df0d55410e22bc5512a6e731" }
tree-sitter-arkts = { git = "https://github.com/Million-mo/tree-sitter-arkts", tag = "v0.1.3" }
