[package]
name = "vibe-analyzer"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Agentic RAG engine for code and knowledge bases. AST extraction, LLM enrichment, OpenSearch indexing."
repository = "https://gitcode.com/keygenqt_vz/vibe-analyzer"
documentation = "https://vibe-analyzer.keygenqt.com"
authors = ["Vitaliy Zarubin <keygenqt@yandex.ru"]
readme = "README.crates.md"

[profile.release]
opt-level = "z"
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap-cargo = "0.18"
colored = "3.1"
tokio = { version = "1", features = ["full"] }
lazy_static = "1.5"
walkdir = "2.5"
ignore = "0.4"
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_toon = "0.2"
json5 = "1.3"
toml = "1.1.2"
yaml_serde = "0.10.4"
serde-xml-rs = "0.8"
xml = "1.2"
chrono = "0.4"
anyhow = "1"
thiserror = "2"
dunce = "1"
dirs = "6"
once_cell = "1.19"
uuid = { version = "1.18.1", features = ["v4"] }
askalono = "0.5.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
zip = "8.5"
tempfile = "3.27"
regex = "1.10"
futures = "0.3"
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "normalize-path"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "1.4.0", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
    "client",
    "reqwest",
    "transport-streamable-http-client-reqwest",
] }
rmcp-macros = "1.4.0"
schemars = "1.2.1"
async-trait = "0.1.89"

# Tree-sitter grammars
tree-sitter = "0.25.1"

# NOTE: Tree-sitter grammars use different core library versions (0.20 and 0.25).
# Cargo includes both versions in the final binary because they are SemVer-incompatible.
# This works as long as symbol names don't conflict across parsers.
# Tested and working on both macOS and Linux.
tree-sitter-dart = "0.1.0"          # 0.25.4
tree-sitter-python = "0.25.0"       # 0.25.8
tree-sitter-rust = "0.24.2"         # 0.25
tree-sitter-go = "0.25.0"           # 0.25.8
tree-sitter-javascript = "0.25.0"   # 0.25.8
tree-sitter-typescript = "0.23.2"   # 0.24
tree-sitter-java = "0.23.5"         # 0.24
tree-sitter-c-sharp = "0.23.5"      # 0.25
tree-sitter-swift = "0.7.1"         # 0.23.0
tree-sitter-bash = "0.25.1"         # 0.25
tree-sitter-batch = "0.7.0"         # 0.26.5
tree-sitter-kotlin-ng = "1.1.0"     # 0.24
tree-sitter-arkts-ng = "0.1.3"      # 0.25.3
tree-sitter-markdown-fork = "0.7.3" # 0.19

vibe-ast = "0.0.5"
lru = "0.18"

[dev-dependencies]
os_pipe = "1.2"
