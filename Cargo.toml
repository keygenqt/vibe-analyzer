[package]
name = "vibe-analyzer"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
description = "Fast code indexer with AST analysis for OpenSearch MCP"

[profile.release]
opt-level = "z"
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap-cargo = "0.18"
colored = "3.1"
tokio = { version = "1", features = ["full"] }
lazy_static = "1.5"
walkdir = "2.5"
ignore = "0.4"
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_toon = "0.2"
json5 = "1.3"
serde-xml-rs = "0.8"
xml = "1.2"
chrono = "0.4"
anyhow = "1"
thiserror = "2"
dunce = "1"
dirs = "6"
once_cell = "1.19"
uuid = { version = "1.18.1", features = ["v4"] }
askalono = "0.5.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
zip = "8.5"
tempfile = "3.27"
regex = "1.10"
futures = "0.3"
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "normalize-path"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "1.4.0", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
rmcp-macros = "1.4.0"
schemars = "1.2.1"

# Tree-sitter grammars
tree-sitter = "0.25.1"

# WARNING: Tree-sitter version synchronization is impossible without forking and fixing all parsers.
# Different parsers depend on different tree-sitter versions (0.19 to 0.26).
# macOS linker (ld64) tolerates multiple definitions and passes with lto = "fat".
# Linux linker (ld) fails with multiple definition errors, so lto is disabled via release-linux profile.
# Tests pass on all platforms, so we rely on them to ensure correctness.
tree-sitter-dart = "0.1.0"                                                                                                         # 0.25.4
tree-sitter-python = "0.25.0"                                                                                                      # 0.25.8
tree-sitter-rust = "0.24.2"                                                                                                        # 0.25
tree-sitter-go = "0.25.0"                                                                                                          # 0.25.8
tree-sitter-javascript = "0.25.0"                                                                                                  # 0.25.8
tree-sitter-typescript = "0.23.2"                                                                                                  # 0.24
tree-sitter-java = "0.23.5"                                                                                                        # 0.24
tree-sitter-c-sharp = "0.23.5"                                                                                                     # 0.25
tree-sitter-swift = "0.7.1"                                                                                                        # 0.23.0
tree-sitter-bash = "0.25.1"                                                                                                        # 0.25
tree-sitter-batch = "0.7.0"                                                                                                        # 0.26.5
tree-sitter-xml = "0.7.0"                                                                                                          # 0.24
tree-sitter-kotlin = { git = "https://github.com/danieltrt/tree-sitter-kotlin", rev = "ff4faf1d4e76a579df0d55410e22bc5512a6e731" } # 0.21
tree-sitter-arkts = { git = "https://github.com/Million-mo/tree-sitter-arkts", tag = "v0.1.3" }                                    # 0.25.3
tree-sitter-markdown-fork = "0.7.3"                                                                                                # 0.19
