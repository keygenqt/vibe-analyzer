[package]
name = "vibe-analyzer"
version = "0.0.3"
edition = "2024"
license = "Apache-2.0"
description = "Agentic RAG engine for code and knowledge bases. AST extraction, LLM enrichment, OpenSearch indexing."
repository = "https://gitcode.com/keygenqt_vz/vibe-analyzer"
documentation = "https://vibe-analyzer.keygenqt.com"
authors = ["Vitaliy Zarubin <keygenqt@yandex.ru"]
readme = "README.crates.md"

[profile.release]
opt-level = "z"
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap-cargo = "0.18"
colored = "3.1"
tokio = { version = "1", features = ["full"] }
lazy_static = "1.5"
walkdir = "2.5"
ignore = "0.4"
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_toon = "0.2"
json5 = "1.3"
toml = "1.1.2"
yaml_serde = "0.10.4"
serde-xml-rs = "0.8"
xml = "1.2"
chrono = "0.4"
anyhow = "1"
thiserror = "2"
dunce = "1"
dirs = "6"
once_cell = "1.19"
uuid = { version = "1.18.1", features = ["v4"] }
askalono = "0.5.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
lru = "0.18"
futures-util = "0.3"
zip = "8.5"
tempfile = "3.27"
regex = "1.10"
futures = "0.3"
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "normalize-path"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "1.4.0", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
    "client",
    "reqwest",
    "transport-streamable-http-client-reqwest",
] }
rmcp-macros = "1.4.0"
schemars = "1.2.1"
async-trait = "0.1.89"
vibe-ast = "0.0.12"
vibe-fs = "0.0.3"

[dev-dependencies]
vibe-tests = "0.0.1"
ctor = "1.0.1"
